name: Deterministic CI

on:
  workflow_call:
    inputs:
      full-matrix:
        description: Also run the older stable Velocity lines (the release gate)
        type: boolean
        default: false
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java ${{ matrix.java }} / verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java:
          - "21"
          - "25"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Restore Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          # Fall back to the newest cache for this OS when pom.xml changed, so a POM edit does
          # not send the whole build to Maven Central (which rate-limits runners).
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Verify with Maven Wrapper
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Test release and canary tooling
        if: matrix.java == '21'
        run: |
          python3 -m unittest discover -s scripts/release -p "test_*.py"
          python3 -m unittest discover -s scripts/canary -p "test_*.py"

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-${{ matrix.java }}-failure-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 7

  # The committed mvnw.cmd carries a local fix for Maven Wrapper 3.3.4 (#52); this job keeps the
  # Windows entry point working until a fixed upstream release replaces it. It guards the
  # contributor entry point, not the release artifact, so the release gate (full-matrix) skips it.
  windows:
    name: Windows / Maven Wrapper verify
    if: ${{ !inputs.full-matrix }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          # Fall back to the newest cache for this OS when pom.xml changed, so a POM edit does
          # not send the whole build to Maven Central (which rate-limits runners).
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Verify with mvnw.cmd
        shell: cmd
        run: mvnw.cmd --batch-mode --no-transfer-progress clean verify

      - name: Start mvnw.cmd from hidden, redirected and junction Maven user homes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-Launcher([string] $description) {
            $output = & .\mvnw.cmd --batch-mode --version 2>&1
            if ($LASTEXITCODE -ne 0) {
              $output | Out-Host
              throw "mvnw.cmd failed to start with $description"
            }
            Write-Host "mvnw.cmd starts with $description"
          }

          $hidden = Join-Path $env:RUNNER_TEMP 'm2-hidden'
          New-Item -ItemType Directory -Path $hidden | Out-Null
          (Get-Item -Path $hidden -Force).Attributes = 'Hidden, Directory'
          $env:MAVEN_USER_HOME = $hidden
          Assert-Launcher 'a hidden MAVEN_USER_HOME'

          $redirected = Join-Path $env:RUNNER_TEMP 'm2-redirected'
          $env:MAVEN_USER_HOME = $redirected
          Assert-Launcher 'a new redirected MAVEN_USER_HOME'

          $junction = Join-Path $env:RUNNER_TEMP 'm2-junction'
          New-Item -ItemType Junction -Path $junction -Target $redirected | Out-Null
          $env:MAVEN_USER_HOME = $junction
          Assert-Launcher 'a MAVEN_USER_HOME junction'

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-failure-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 7

  velocity:
    name: Velocity ${{ matrix.profile }} / packaged runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run the floor, the recommended stable line, and the preview
        # snapshot. The release gate (full-matrix) adds the older stable lines.
        profile: ${{ fromJSON(inputs.full-matrix && '["legacy","stable-4.0","stable-4.1","stable","preview"]' || '["legacy","stable","preview"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 build toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          # Fall back to the newest cache for this OS when pom.xml changed, so a POM edit does
          # not send the whole build to Maven Central (which rate-limits runners).
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Confirm Docker availability
        run: docker info

      - name: Verify ${{ matrix.profile }} packaged runtime
        run: >-
          ./mvnw --batch-mode --no-transfer-progress clean verify
          -Psystem-tests
          -Dvelocity.system.profiles=${{ matrix.profile }}

      - name: Upload failure reports and runtime logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: velocity-${{ matrix.profile }}-failure-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/spotbugsXml.xml
            target/velocity-system-tests/logs/
          if-no-files-found: ignore
          retention-days: 7
