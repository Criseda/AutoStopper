name: Deterministic CI

on:
  workflow_call:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java ${{ matrix.java }} / verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java:
          - "21"
          - "25"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Verify with Maven Wrapper
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Test release tooling
        if: matrix.java == '21'
        run: python3 -m unittest discover -s scripts/release -p "test_*.py"

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-${{ matrix.java }}-failure-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 7

  velocity:
    name: Velocity ${{ matrix.profile }} / packaged runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile:
          - legacy
          - stable
          - preview
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 build toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Confirm Docker availability
        run: docker info

      - name: Verify ${{ matrix.profile }} packaged runtime
        run: >-
          ./mvnw --batch-mode --no-transfer-progress clean verify
          -Psystem-tests
          -Dvelocity.system.profiles=${{ matrix.profile }}

      - name: Upload failure reports and runtime logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velocity-${{ matrix.profile }}-failure-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/spotbugsXml.xml
            target/velocity-system-tests/logs/
          if-no-files-found: ignore
          retention-days: 7
