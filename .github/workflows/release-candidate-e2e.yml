name: Release candidate E2E

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "43 2 * * *"

permissions:
  contents: read

concurrency:
  group: release-candidate-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate-e2e:
    name: Release candidate / Docker Minecraft E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 build toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Confirm Docker and Compose availability
        run: |
          docker info
          docker compose version

      - name: Verify exact release candidate end to end
        run: >-
          ./mvnw --batch-mode --no-transfer-progress clean verify
          -Prelease-candidate-e2e

      - name: Upload failure reports and E2E evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-e2e-failure-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/spotbugsXml.xml
            target/release-candidate-e2e/evidence/
          if-no-files-found: ignore
          retention-days: 14
