version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Dependabot assigns each dependency to the first group it matches, so the
    # runtime catch-all must stay last. Major updates stay as individual PRs.
    groups:
      test-dependencies:
        patterns:
          - "org.junit:*"
          - "org.junit.jupiter:*"
          - "org.junit.platform:*"
          - "org.mockito:*"
        update-types:
          - minor
          - patch
      build-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "org.jacoco:*"
          - "com.github.spotbugs:*"
        update-types:
          - minor
          - patch
      runtime-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Velocity major-line compatibility is validated deliberately against all supported runtimes.
      - dependency-name: "com.velocitypowered:velocity-api"
        update-types:
          - version-update:semver-major
