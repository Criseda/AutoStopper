# Fail fast instead of hanging when a test blocks forever, for example on a
# CompletableFuture.join() whose future is never completed because an Error
# was swallowed inside a completion callback. join() ignores interrupts, so the
# timeout must run each test in a separate thread to be able to abandon it.
junit.jupiter.execution.timeout.default = 30 s
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
