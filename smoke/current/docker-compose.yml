services:
  velocity:
    image: eclipse-temurin:25-jre
    container_name: autostopper-smoke-current
    working_dir: /proxy
    entrypoint: ["/bin/sh", "/proxy/run-velocity.sh"]
    volumes:
      - ./runtime:/proxy/runtime:ro
      - ./plugins:/proxy/plugins
      - ./velocity.toml:/proxy/config/velocity.toml:ro
      - ./run-velocity.sh:/proxy/run-velocity.sh:ro